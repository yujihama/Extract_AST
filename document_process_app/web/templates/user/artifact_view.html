{% extends "user/base.html" %}

        <div>
          <h1 class="text-xl font-semibold">成果物プレビュー</h1>
          <div class="text-xs text-base-content/60 font-mono mt-1">{{ rel }}</div>

        <a href="/u/{{ usecase }}/runs/{{ run_id }}" class="btn btn-ghost btn-sm">戻る</a>

  </div>
